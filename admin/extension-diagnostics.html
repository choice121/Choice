<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/cp-error-reporter.js?v=1793990899990-extension-diagnostics"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0a0f1e">
  <title>Extension Diagnostics · Choice Properties Admin</title>
  <link rel="stylesheet" href="/css/cp-design.css?v=1793990899990-extension-diagnostics">
  <script defer src="/config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js" integrity="sha384-YieCqqg9gQufX7+5HcFvCEg/n3KUEdl8/Jb+A6J0npf1mB740VayvwKjTrtCeUoy" crossorigin="anonymous"></script>
  <script type="module" src="/js/admin/extension-diagnostics.js?v=1793990899990-extension-diagnostics"></script>
  <style>
    .diagnostics-page{max-width:1100px;margin:0 auto;padding:24px}
    .diagnostics-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
    .diagnostics-heading h1{margin:0}
    .diagnostics-state{padding:18px;border:1px solid var(--border);border-radius:12px;color:var(--muted-2)}
    .diagnostic-report{margin:12px 0;padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
    .diagnostic-report summary{cursor:pointer;font-weight:700}
    .diagnostic-meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;color:var(--muted-2);font-size:.8rem}
    .diagnostic-report pre{max-height:520px;overflow:auto;padding:14px;border-radius:8px;background:var(--surface-2);font-size:.76rem;white-space:pre-wrap;overflow-wrap:anywhere}
    @media(max-width:600px){.diagnostics-page{padding:16px}.diagnostics-heading{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="diagnostics-page">
    <header class="diagnostics-heading">
      <div>
        <p class="eyebrow">Admin tools</p>
        <h1>Extension diagnostics</h1>
      </div>
      <div style="display:flex;gap:8px">
        <a class="btn btn-outline" href="/admin/pipeline.html">Pipeline</a>
        <button class="btn btn-primary" id="diagnostics-refresh" type="button">Refresh</button>
      </div>
    </header>
    <p>Recent extraction reports contain minimized listing facts and page structure only. They expire after 30 days.</p>
    <section id="diagnostics-reports" aria-live="polite">
      <div class="diagnostics-state">Loading diagnostics…</div>
    </section>
  </main>
</body>
</html>
