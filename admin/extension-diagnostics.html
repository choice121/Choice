<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/cp-error-reporter.js?v=1793378679003"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Extension Diagnostics · Choice Properties Admin</title>
  <link rel="stylesheet" href="/css/cp-design.css?v=1793378679003">
  <script defer src="/config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js" integrity="sha384-YieCqqg9gQufX7+5HcFvCEg/n3KUEdl8/Jb+A6J0npf1mB740VayvwKjTrtCeUoy" crossorigin="anonymous"></script>
  <script defer src="/js/cp-api.js?v=1793378679003" type="module"></script>
  <script defer src="/js/admin/extension-diagnostics.js?v=1793378679003"></script>
  <style>
    body { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .diagnostics-header { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .diagnostics-note { color:var(--muted-2); max-width:760px; line-height:1.55; }
    .diagnostic-list { display:grid; gap:12px; margin-top:20px; }
    .diagnostic-card { border:1px solid var(--border); border-radius:12px; padding:14px; background:var(--surface); }
    .diagnostic-meta { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
    .diagnostic-meta a { overflow-wrap:anywhere; }
    .diagnostic-report { overflow:auto; max-height:650px; padding:12px; background:var(--surface-2); border-radius:8px; font-size:12px; }
    .diagnostic-status { margin-top:14px; color:var(--muted-2); }
    .diagnostic-status.error { color:#f87171; }
    @media(max-width:600px) { body { padding:16px; } .diagnostics-header { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <header class="diagnostics-header">
    <div>
      <h1>Extension Diagnostics</h1>
      <p class="diagnostics-note">Opt-in reports include extracted listing facts, unit options, extractor status, and page-structure counts. They exclude cookies, session data, descriptions, contact details, and raw page HTML. Reports are available to admins for 30 days.</p>
    </div>
    <button type="button" class="btn btn-primary" id="refresh-diagnostics">Refresh reports</button>
  </header>
  <p class="diagnostic-status" id="diagnostics-status" role="status" aria-live="polite">Checking admin access…</p>
  <main class="diagnostic-list" id="diagnostic-list"></main>
</body>
</html>
