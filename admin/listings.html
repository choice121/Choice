<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/cp-error-reporter.js?v=1788375467077"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1e">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <title>Properties · Choice Properties Admin</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="/css/cp-admin.css?v=1788375467077">
  <script defer src="/config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.0/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
  <script defer src="/js/cp-api.js" type="module"></script>
  <script defer src="/js/cp-chrome.js?v=1788375467077"></script>
  <script defer src="/js/cp-shell.js?v=1788375467077"></script>
  <style>
    .pm-toolbar{display:grid;grid-template-columns:minmax(220px,1fr) repeat(3,minmax(130px,auto));gap:8px;margin-bottom:12px}
    .pm-toolbar input,.pm-toolbar select{width:100%;box-sizing:border-box}
    .pm-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;color:var(--muted);font-size:.78rem}
    .pm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
    .pm-card{display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);min-width:0}
    .pm-card:hover{border-color:var(--brand);box-shadow:0 4px 18px rgba(0,0,0,.14)}
    .pm-photo{position:relative;aspect-ratio:16/10;background:var(--surface-2)}
    .pm-photo img{width:100%;height:100%;object-fit:cover;display:block}
    .pm-photo-empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted-2);font-size:.8rem}
    .pm-status{position:absolute;top:9px;left:9px}
    .pm-body{padding:12px 14px 8px;display:flex;flex-direction:column;gap:5px;min-width:0}
    .pm-title{font-weight:800;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
    .pm-address{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pm-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.74rem;color:var(--muted-2)}
    .pm-rent{font-size:1rem;font-weight:800;color:var(--text);margin-top:2px}
    .pm-landlord{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pm-actions{display:flex;gap:7px;padding:9px 12px 11px;border-top:1px solid var(--border);margin-top:auto}
    .pm-actions .btn{flex:1;justify-content:center;font-size:.72rem;padding:6px 8px}
    .pm-pagination{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 0 72px}
    @media(max-width:760px){.pm-toolbar{grid-template-columns:1fr 1fr}.pm-toolbar .pm-search{grid-column:1/-1}}
    @media(max-width:430px){.pm-toolbar{grid-template-columns:1fr}.pm-toolbar .pm-search{grid-column:auto}}
  </style>
</head>
<body data-portal="admin" data-page-title="Properties" data-page-sub="All platform listings">
  <div class="app">
    <main class="app-content">
      <div class="pm-toolbar">
        <div class="search pm-search">
          <svg class="i"><use href="#i-search"/></svg>
          <input id="pm-search" type="search" placeholder="Search address, title, city, ZIP…" autocomplete="off">
        </div>
        <select id="pm-status" class="form-input" aria-label="Filter by status">
          <option value="all">All statuses</option>
          <option value="active">Active</option>
          <option value="rented">Rented</option>
          <option value="inactive">Inactive</option>
          <option value="maintenance">Maintenance</option>
          <option value="draft">Draft</option>
          <option value="paused">Paused</option>
          <option value="archived">Archived</option>
        </select>
        <select id="pm-landlord" class="form-input" aria-label="Filter by landlord">
          <option value="">All landlords</option>
        </select>
        <select id="pm-sort" class="form-input" aria-label="Sort properties">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="rent_high">Rent: high to low</option>
          <option value="rent_low">Rent: low to high</option>
        </select>
      </div>
      <div class="pm-summary">
        <span id="pm-count">Loading properties…</span>
        <button class="btn btn-ghost btn-sm" id="pm-reset" type="button">Reset filters</button>
      </div>
      <div id="pm-list"></div>
      <div class="pm-pagination" id="pm-pagination" hidden>
        <button class="btn btn-ghost btn-sm" id="pm-prev" type="button">Previous</button>
        <span id="pm-page" class="text-xs muted"></span>
        <button class="btn btn-ghost btn-sm" id="pm-next" type="button">Next</button>
      </div>
    </main>
  </div>
  <script defer src="/js/admin/listings.js?v=1788375467077"></script>
</body>
</html>
