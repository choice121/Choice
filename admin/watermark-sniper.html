<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/cp-error-reporter.js?v=1787573018214"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Watermark Sniper · Choice Properties Admin</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/css/cp-design.css?v=1787573018214">
<link rel="stylesheet" href="/css/admin/watermark-sniper.css?v=1787573018214">
<script defer src="/config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js" integrity="sha384-YieCqqg9gQufX7+5HcFvCEg/n3KUEdl8/Jb+A6J0npf1mB740VayvwKjTrtCeUoy" crossorigin="anonymous"></script>
<script defer src="/js/cp-api.js" type="module"></script>
<script defer src="/js/cp-chrome.js?v=1787573018214"></script>
<script defer src="/js/cp-shell.js?v=1787573018214"></script>
</head>
<body data-page-title="Watermark Sniper" data-page-sub="Visual Photo Moderation">
<div class="app">
  <main class="app-content" style="padding:0;max-width:none">

    <div class="sniper-container">
      
      <!-- Main Photo Grid Panel -->
      <section class="sniper-main">
        <header class="sniper-header">
          <div class="sniper-header-top">
            <div class="sniper-title-group">
              <h1>Watermark Sniper</h1>
              <p>Click any photo containing a watermark, logo, or flyer text to stage the property for deletion.</p>
            </div>
            <div class="sniper-stats">
              <span><strong class="sniper-stats-num" id="stats-images">0</strong> photos</span>
              <span>•</span>
              <span><strong class="sniper-stats-num" id="stats-props">0</strong> properties</span>
            </div>
          </div>

          <div class="sniper-controls">
            <div class="sniper-search">
              <svg class="sniper-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input id="sniper-search-input" type="search" placeholder="Filter by address, city, ID…" autocomplete="off" aria-label="Search listings">
              <button class="sniper-search-clear" id="sniper-search-clear" aria-label="Clear search" style="display:none">✕</button>
            </div>

            <div class="sniper-filter-tabs" role="tablist" aria-label="Filter photos">
              <button class="sniper-filter-tab active" id="tab-filter-all" role="tab" aria-selected="true">All Photos</button>
              <button class="sniper-filter-tab" id="tab-filter-flagged" role="tab" aria-selected="false">Flagged Only</button>
            </div>
          </div>
        </header>

        <div class="sniper-grid-wrap">
          <div class="sniper-grid" id="sniper-grid">
            <!-- Photos injected here -->
          </div>
        </div>
      </section>

      <!-- Staging Queue (Desktop Sidebar / Mobile Collapsible Bottom Drawer) -->
      <aside class="sniper-sidebar" id="sniper-sidebar" aria-label="Staging Queue">
        <div class="sniper-sidebar-header" id="sniper-sidebar-header">
          <div class="sniper-queue-title">
            <span>Staging Queue</span>
            <span class="sniper-queue-badge" id="sniper-queue-badge">0</span>
          </div>
          <div class="sniper-toggle-icon" id="sniper-toggle-icon" aria-hidden="true">
            <svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
          </div>
        </div>

        <div class="sniper-queue-list" id="sniper-queue-list">
          <div class="sniper-empty-queue" id="sniper-empty-queue">
            <svg style="width:36px;height:36px;margin:0 auto 10px;opacity:.35;display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            Click any photo in the wall to stage a property for deletion.
          </div>
        </div>

        <div class="sniper-sidebar-footer">
          <button class="sniper-delete-btn" id="sniper-btn-delete" disabled>
            <svg style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/></svg>
            Delete Flagged Properties <span id="sniper-del-count"></span>
          </button>
          <button class="sniper-clear-btn" id="sniper-btn-clear" disabled>
            Clear Staging Queue
          </button>
        </div>
      </aside>

    </div>

    <!-- Loading Overlay -->
    <div class="sniper-loading" id="sniper-loading">
      <div class="sniper-spinner"></div>
      <div style="font-weight:600">Loading catalog photos…</div>
    </div>

  </main>
</div>

<script defer src="/js/admin/watermark-sniper.js?v=1787573018214"></script>
</body>
</html>
