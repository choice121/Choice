<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/cp-error-reporter.js?v=1790890545945"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1e">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <title>Property Tours · Choice Properties Admin</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="/css/cp-design.css?v=1790890545945">
  <script defer src="/config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js" integrity="sha384-YieCqqg9gQufX7+5HcFvCEg/n3KUEdl8/Jb+A6J0npf1mB740VayvwKjTrtCeUoy" crossorigin="anonymous"></script>
  <script defer src="/js/cp-api.js?v=1790890545945" type="module"></script>
  <script defer src="/js/cp-chrome.js?v=1790890545945"></script>
  <script defer src="/js/cp-shell.js?v=1790890545945"></script>
  <style>
    .tour-layout{display:grid;grid-template-columns:minmax(280px,.85fr) minmax(0,1.5fr);gap:16px;align-items:start}
    .tour-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px}
    .tour-panel h2{font-size:1rem;margin:0 0 12px}
    .tour-form{display:grid;gap:10px}
    .tour-form label{display:grid;gap:5px;color:var(--muted-2);font-size:.76rem;font-weight:700}
    .tour-form input,.tour-form select,.tour-form textarea,.message-form textarea{width:100%;min-height:40px;padding:9px 11px;border:1px solid var(--border);border-radius:7px;background:var(--surface-2,var(--surface));color:var(--text);font:inherit;font-size:.88rem}
    .tour-form textarea,.message-form textarea{min-height:76px;resize:vertical}
    .tour-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .tour-switch{display:flex;gap:8px;margin-bottom:12px}
    .tour-switch button.active{border-color:#4ab394;color:#9be3c8}
    .tour-note{font-size:.75rem;color:var(--muted-2);line-height:1.5}
    .tour-result{margin-top:10px;padding:10px;background:rgba(74,179,148,.1);border:1px solid rgba(74,179,148,.35);border-radius:7px;overflow-wrap:anywhere}
    .tour-result input{width:100%;margin:6px 0;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}
    .tour-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .tour-summary span{padding:6px 9px;border:1px solid var(--border);border-radius:6px;font-size:.75rem;color:var(--muted-2)}
    .tour-filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
    .tour-list{display:grid;gap:10px}
    .tour-request{border:1px solid var(--border);border-radius:8px;padding:14px;background:var(--surface)}
    .tour-request-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .tour-request h3{font-size:.95rem;margin:0 0 3px}
    .tour-muted{font-size:.78rem;color:var(--muted-2);line-height:1.5}
    .tour-times{margin:10px 0;padding:9px 11px;background:var(--surface-2,var(--surface));border-radius:6px;font-size:.8rem;line-height:1.7}
    .tour-status{font-size:.68rem;text-transform:uppercase;font-weight:800;border:1px solid var(--border);border-radius:99px;padding:4px 8px;white-space:nowrap}
    .tour-status.requested{color:#ffd17b;border-color:#795d28}.tour-status.confirmed{color:#92dfbf;border-color:#34785d}.tour-status.declined,.tour-status.cancelled{color:#f4a9a9;border-color:#854d4d}
    .tour-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .tour-conversation{display:grid;gap:6px;margin:10px 0;padding:10px;border-top:1px solid var(--border)}
    .tour-message{font-size:.78rem;line-height:1.5;padding:7px 9px;border-radius:6px;background:var(--surface-2,var(--surface))}
    .tour-message.admin{border-left:3px solid #4ab394}.tour-message.guest{border-left:3px solid #7ca9d1}
    .message-form{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:end}
    .tour-empty{padding:34px 12px;text-align:center;color:var(--muted-2);font-size:.85rem}
    @media(max-width:820px){.tour-layout{grid-template-columns:1fr}.tour-row{grid-template-columns:1fr}}
  </style>
</head>
<body data-page-title="Property Tours" data-page-sub="Private scheduling and requests">
<div class="app"><main class="app-content">
  <div class="tour-layout">
    <section class="tour-panel">
      <h2>Invite a guest</h2>
      <div class="tour-switch" role="tablist" aria-label="Tour invitation method">
        <button class="btn btn-ghost btn-sm active" type="button" data-mode="link">Send request link</button>
        <button class="btn btn-ghost btn-sm" type="button" data-mode="direct">Schedule now</button>
      </div>
      <form class="tour-form" id="link-form">
        <label>Property<select name="property_id" required><option value="">Loading properties…</option></select></label>
        <div class="tour-row">
          <label>Guest name<input name="name" autocomplete="name" maxlength="120"></label>
          <label>Guest email<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
        </div>
        <p class="tour-note">The private link expires in 30 days. The guest requests preferred times; nothing is confirmed until an admin approves a time.</p>
        <button class="btn btn-primary" type="submit">Email private scheduling link</button>
      </form>
      <form class="tour-form" id="direct-form" hidden>
        <label>Property<select name="property_id" required><option value="">Loading properties…</option></select></label>
        <div class="tour-row">
          <label>Guest name<input name="name" autocomplete="name" maxlength="120"></label>
          <label>Guest email<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
        </div>
        <label>Confirmed date and time<input name="confirmed_for" type="datetime-local" required></label>
        <label>Visit instructions<textarea name="instructions" maxlength="3000" placeholder="Arrival, access, parking, and who to ask for"></textarea></label>
        <p class="tour-note">This schedules the visit immediately and emails the guest the confirmed time and instructions.</p>
        <button class="btn btn-primary" type="submit">Schedule tour and email guest</button>
      </form>
      <div id="created-link" class="tour-result" hidden></div>
      <div id="feedback" class="tour-note" role="status" aria-live="polite" style="margin-top:10px"></div>
    </section>

    <section class="tour-panel">
      <div class="row-flex between" style="gap:10px;flex-wrap:wrap">
        <h2 style="margin:0">Tour requests</h2>
        <button class="btn btn-ghost btn-sm" id="refresh-tours" type="button">Refresh</button>
      </div>
      <div class="tour-summary" id="tour-summary"></div>
      <div class="tour-filters" role="tablist" aria-label="Filter tour requests">
        <button class="chip active" type="button" data-filter="all">All</button>
        <button class="chip" type="button" data-filter="requested">Needs review</button>
        <button class="chip" type="button" data-filter="confirmed">Confirmed</button>
        <button class="chip" type="button" data-filter="closed">Closed</button>
      </div>
      <div class="tour-list" id="tour-list"><div class="tour-empty">Loading tour requests…</div></div>
    </section>
  </div>
</main></div>
<script defer src="/js/admin/tours.js?v=1790890545945"></script>
</body>
</html>
