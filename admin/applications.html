<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/cp-error-reporter.js?v=1794833058774"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Applications · Choice Properties Admin</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/css/cp-design.css?v=1794833058774">
<script defer src="/config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js" integrity="sha384-YieCqqg9gQufX7+5HcFvCEg/n3KUEdl8/Jb+A6J0npf1mB740VayvwKjTrtCeUoy" crossorigin="anonymous"></script>
<script defer src="/js/cp-api.js?v=1794833058774" type="module"></script>
<script defer src="/js/cp-chrome.js?v=1794833058774"></script>
<script defer src="/js/cp-shell.js?v=1794833058774"></script>
<link rel="stylesheet" href="/css/admin/applications.css?v=1794833058774">
</head>
<body data-page-title="Applications" data-page-sub="Loading…">
<div class="app">
  <main class="app-content">

    <div class="toolbar">
      <div class="search">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="search-input" placeholder="Search name, email, phone, app id…" autocomplete="off">
      </div>
      <select id="pay-filter" aria-label="Payment filter">
        <option value="">All payments</option>
        <option value="needs_payment">Needs Payment (Unpaid / Verification / Failed)</option>
        <option value="Payment Required">Payment Required</option>
        <option value="Payment Method Selected">Payment Method Selected</option>
        <option value="Awaiting Payment">Awaiting Payment</option>
        <option value="Payment Submitted for Verification">Submitted for Verification</option>
        <option value="Payment Confirmed">Payment Confirmed</option>
        <option value="Payment Unsuccessful">Payment Unsuccessful</option>
        <option value="Payment Cancelled">Payment Cancelled</option>
        <option value="Payment Processing">Payment Processing</option>
        <option value="Payment Successful">Legacy: Payment Successful</option>
        <option value="Payment Failed">Legacy: Payment Failed</option>
        <option value="Payment Assistance Required">Payment Assistance Required</option>
        <option value="paid">Paid</option>
        <option value="unpaid">Unpaid</option>
        <option value="waived">Waived</option>
        <option value="refunded">Refunded</option>
      </select>
      <button class="btn btn-ghost btn-sm" id="btn-cleanup-drafts" title="Delete draft applications older than 7 days">🗑 Clean drafts</button>
      <button class="btn btn-ghost btn-sm" id="btn-nudge-drafts" title="Send expiry reminder emails to applicants whose draft expires in under 48 hours">📧 Nudge expiring</button>
    </div>

    <div class="chip-row" id="filter-tabs" role="tablist" aria-label="Status filter">
      <button class="chip active" data-status="all">All</button>
      <button class="chip" data-status="pending">Pending</button>
      <button class="chip" data-status="under_review">Under Review</button>
      <button class="chip" data-status="additional_info_required">Info Required</button>
      <button class="chip" data-status="approved">Approved</button>
      <button class="chip" data-status="waitlisted">Waitlisted</button>
      <button class="chip" data-status="denied">Not Approved</button>
      <button class="chip" data-status="withdrawn">Withdrawn</button>
      <button class="chip" data-status="archived">Archived</button>
    </div>

    <div class="stats-bar" id="stats-bar"></div>

    <!-- Bulk-action toolbar row: select-all + selection count.
         The sticky bulk-bar (#bulk-bar-slot) appears below the list when
         1+ rows are selected. -->
    <div class="bulk-toolbar-row" id="bulk-toolbar-row" hidden>
      <label>
        <input type="checkbox" class="bulk-cb-all" id="bulk-cb-all" aria-label="Select all visible applications">
        <span id="bulk-cb-all-label">Select all visible</span>
      </label>
    </div>

    <div id="apps-list">
      <div class="list">
        <div class="skeleton sk-line lg" style="height:90px;margin-bottom:10px"></div>
        <div class="skeleton sk-line lg" style="height:90px;margin-bottom:10px"></div>
        <div class="skeleton sk-line lg" style="height:90px;margin-bottom:10px"></div>
      </div>
    </div>

    <section class="ledger-panel" id="ledger-panel" aria-label="Payment Attempt Logs and Transaction Ledger">
      <div class="ledger-header">
        <div>
          <div class="ledger-title">Payment Attempt Logs &amp; Transaction Ledger</div>
          <div class="text-xs muted" id="ledger-summary">Card gateway attempts across all household applications (masked card descriptors only).</div>
        </div>
        <button type="button" class="btn-act" id="ledger-toggle-btn" data-action="toggle-ledger" aria-expanded="false">Show Ledger</button>
      </div>
      <div class="ledger-body" id="ledger-body" hidden>
        <div class="text-sm muted">Loading transaction ledger…</div>
      </div>
    </section>

    <div id="bulk-bar-slot" aria-live="polite"></div>

  </main>
</div>

<script defer src="/js/admin/applications.js?v=1794833058774_receipts_sms"></script>

</body>
</html>
