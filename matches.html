<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/cp-error-reporter.js?v=1788627266028"></script>
  <script nonce="__CSP_NONCE__">
    (function(){
      try {
        var t = localStorage.getItem('cp-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Your Property Matches — Choice Properties</title>
  <meta name="description" content="View your personalized property matches.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/css/mv2-globals.css?v=1788627266028">
  <link rel="stylesheet" href="/css/mv2-nav.css?v=1788627266028">
  <link rel="stylesheet" href="/css/mv2-footer.css?v=1788627266028">
  <link rel="stylesheet" href="/css/listings.css?v=1788627266028">
  <link rel="stylesheet" href="/css/card.css?v=1788627266028">
  <style>
    .match-header {
      background: var(--bg-card);
      padding: 40px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 30px;
    }
    .match-header h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-base);
      margin-bottom: 10px;
      letter-spacing: -0.03em;
    }
    .match-header p {
      font-size: 16px;
      color: var(--text-muted);
    }
    .match-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .match-empty i {
      font-size: 48px;
      margin-bottom: 20px;
      color: var(--border-light);
    }
    
    /* ── Embedded Property Overlay ── */
    #property-overlay {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: var(--bg-body);
      display: none;
      flex-direction: column;
    }
    #property-overlay.active {
      display: flex;
    }
    .property-overlay-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 12px 20px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      z-index: 2;
    }
    .property-overlay-close {
      background: var(--bg-body);
      border: 1px solid var(--border-light);
      color: var(--text-base);
      font-size: 14px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .property-overlay-close:hover {
      background: var(--bg-hover);
    }
    #property-iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg-body);
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body class="cp-page-matches">
  <a href="#mainContent" class="skip-link">Skip to main content</a>
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <div class="nav-drawer-overlay mv2-nav-drawer-overlay" id="navDrawerOverlay"></div>
  <div class="nav-drawer mv2-nav-drawer" id="navDrawer">
    <button class="nav-drawer-close mv2-nav-drawer-close" id="navDrawerClose" aria-label="Close navigation menu"><i class="fas fa-times"></i></button>
  </div>
  <nav class="nav mv2-nav" id="mainNav">
    <div class="nav-container mv2-nav-container">
      <span class="nav-logo mv2-nav-logo" aria-label="Choice Properties Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Choice Properties</span>
      </span>
      <div class="nav-links mv2-nav-links">
        <button class="nav-theme-toggle mv2-nav-theme-toggle" id="themeToggle" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
      </div>
      <button class="nav-mobile-toggle mv2-nav-mobile-toggle" id="navMobileToggle" aria-label="Open navigation menu"><i class="fas fa-bars"></i></button>
    </div>
  </nav>

  <main id="mainContent">
    <div id="matchHeaderContainer">
      <div class="match-header">
        <h1>Loading your matches...</h1>
      </div>
    </div>
    
    <div class="container listings-container" style="padding-top:0">
      <div class="property-grid" id="propertyGrid" role="list"></div>
    </div>
  </main>

  <footer class="footer mv2-footer">
    <div class="footer-container mv2-footer-container">
      <div class="footer-brand mv2-footer-brand">
        <div class="footer-logo mv2-footer-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Choice Properties
        </div>
        <p class="footer-desc mv2-footer-desc">Curated homes and seamless rentals.</p>
      </div>
    </div>
  </footer>

  <div id="property-overlay">
    <div class="property-overlay-header">
      <button class="property-overlay-close" id="closeOverlayBtn">
        <i class="fas fa-arrow-left"></i> Back to Collection
      </button>
    </div>
    <iframe id="property-iframe" title="Property Details"></iframe>
  </div>

  <script src="/js/cp-ui.js?v=1788627266028"></script>
  <script type="module" src="/js/matches.js?v=1788627266028"></script>
</body>
</html>
