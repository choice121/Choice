<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/cp-error-reporter.js?v=1788131037155"></script>
  <script nonce="__CSP_NONCE__">(function(){try{var t=localStorage.getItem('cp-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1e">
  <link rel="manifest" href="/manifest.json">
  <title>Property Details · Choice Properties</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/cp-design.css?v=1788131037155">
  <style>
    /* Public-facing property detail overrides */
    body[data-portal="public"] .app-content { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .pd-mosaic { display: grid; grid-template-columns: 1fr; gap: 8px; border-radius: var(--r-lg); overflow: hidden; margin-bottom: 8px; }
    @media(min-width: 768px) { .pd-mosaic { grid-template-columns: 2fr 1fr; } }
    .pd-mosaic-main { position: relative; min-height: 280px; max-height: 500px; background: var(--surface-2); cursor: pointer; }
    .pd-mosaic-main img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pd-mosaic-side { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; }
    .pd-mosaic-cell { position: relative; background: var(--surface-2); cursor: pointer; overflow: hidden; }
    .pd-mosaic-cell img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s; }
    .pd-mosaic-cell:hover img { transform: scale(1.05); }
    .pd-gallery-strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; margin-bottom: 24px; scrollbar-width: none; }
    .pd-gallery-strip::-webkit-scrollbar { display: none; }
    .pd-strip-thumb { width: 80px; height: 60px; flex-shrink: 0; border-radius: var(--r-md); overflow: hidden; cursor: pointer; border: 2px solid transparent; opacity: 0.7; transition: opacity 0.2s, border-color 0.2s; }
    .pd-strip-thumb.active, .pd-strip-thumb:hover { opacity: 1; border-color: var(--brand); }
    .pd-strip-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .pd-photo-count { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.7); color: #fff; font-size: 0.8rem; font-weight: 700; padding: 6px 12px; border-radius: 99px; pointer-events: none; }
    
    .pd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .pd-field { background: var(--surface-2); padding: 12px; border-radius: var(--r-md); border: 1px solid var(--border); }
    .pd-field-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .pd-field-value { font-size: 0.95rem; font-weight: 700; color: var(--text); }
    
    .pd-amenity-item { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); padding: 8px 12px; border-radius: var(--r-sm); font-size: 0.85rem; font-weight: 500; border: 1px solid var(--border); margin: 0 8px 8px 0; }
    .pd-header { margin-bottom: 24px; }
    .pd-header-price { font-size: 2rem; font-weight: 800; color: var(--text); line-height: 1.1; margin-bottom: 8px; }
    .pd-header-price span { font-size: 1rem; color: var(--muted); font-weight: 600; }
    .pd-header-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; color: var(--text); }
    .pd-header-address { font-size: 1rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .pd-section-title { font-size: 1.25rem; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 16px; margin-top: 32px; color: var(--text); }
    .pd-desc { font-size: 0.95rem; line-height: 1.6; color: var(--muted); white-space: pre-wrap; }
    
    /* Layout grid for main content vs sidebar */
    .prop-layout { display: grid; grid-template-columns: 1fr; gap: 32px; }
    @media(min-width: 900px) { .prop-layout { grid-template-columns: 2fr 1fr; } }
    .prop-sidebar-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; position: sticky; top: 80px; }
    
    /* Action Bar (mobile sticky) */
    .prop-action-bar { display: flex; flex-direction: column; gap: 12px; }
    @media(max-width: 899px) {
      .prop-sidebar-card { position: fixed; bottom: 0; left: 0; right: 0; border-radius: var(--r-lg) var(--r-lg) 0 0; border-bottom: none; z-index: 90; padding: 16px; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); }
      .prop-layout { padding-bottom: 120px; }
    }
  </style>
</head>
<body data-portal="public">
  <div id="nav-placeholder"></div>
  
  <div class="app">
    <main class="app-content">
      <div id="pd-root">
        <div class="skeleton" style="height: 400px; border-radius: 12px; margin-bottom: 16px;"></div>
        <div class="skeleton" style="height: 60px; border-radius: 8px; margin-bottom: 24px;"></div>
        <div class="skeleton" style="height: 200px; border-radius: 8px;"></div>
      </div>
    </main>
  </div>
  
  <div id="footer-placeholder"></div>

  <!-- Shared Config & Auth -->
  <script defer src="/config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
  <script defer src="/js/cp-api.js"></script>
  <script defer src="/js/cp-chrome.js?v=1788131037155"></script>
  <script defer src="/js/cp-shell.js?v=1788131037155"></script>
  <script defer src="/js/components.js"></script>
  
  <script>
    // Simplified, read-only version of admin/property-detail.js for public viewing
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(location.search);
      const propId = params.get('id');
      const root = document.getElementById('pd-root');
      
      if (!propId) {
        root.innerHTML = '<div class="empty"><h3>Property Not Found</h3><p>Invalid property link.</p><a href="/listings.html" class="btn btn-primary">Browse Listings</a></div>';
        return;
      }
      
      try {
        const { data: p, error } = await supabase
          .from('properties')
          .select('*, property_photos(*)')
          .eq('id', propId)
          .eq('status', 'active')
          .single();
          
        if (error || !p) throw new Error('Listing is no longer available.');
        
        // Formatters
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const fmtMoney = v => v != null ? '$' + Number(v).toLocaleString() : 'TBD';
        const capitalize = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
        
        // Photos
        const photos = Array.isArray(p.property_photos) ? p.property_photos.sort((a,b) => (a.display_order||0) - (b.display_order||0)) : [];
        let galleryHtml = '';
        if (photos.length > 0) {
          const main = photos[0];
          const sides = photos.slice(1, 5);
          galleryHtml += `<div class="pd-mosaic">
            <div class="pd-mosaic-main"><img src="${esc(main.url)}" alt="Main Photo"></div>`;
          if (sides.length > 0) {
            galleryHtml += `<div class="pd-mosaic-side">`;
            sides.forEach(ph => { galleryHtml += `<div class="pd-mosaic-cell"><img src="${esc(ph.url)}" loading="lazy"></div>`; });
            // Pad if less than 4
            for(let i=sides.length; i<4; i++) { galleryHtml += `<div class="pd-mosaic-cell" style="background:var(--surface-3)"></div>`; }
            galleryHtml += `</div>`;
          }
          galleryHtml += `<div class="pd-photo-count"><i class="fas fa-camera"></i> ${photos.length}</div></div>`;
          
          galleryHtml += `<div class="pd-gallery-strip">`;
          photos.forEach((ph, idx) => {
            galleryHtml += `<div class="pd-strip-thumb ${idx===0?'active':''}"><img src="${esc(ph.url)}" loading="lazy"></div>`;
          });
          galleryHtml += `</div>`;
        } else {
          galleryHtml = `<div class="pd-mosaic"><div class="pd-mosaic-main" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600;"><i class="fas fa-image" style="font-size:2rem;margin-bottom:8px;display:block"></i>No Photos Available</div></div>`;
        }
        
        // Details Grid
        const fields = [
          { label:'Bedrooms', value: p.bedrooms != null ? (p.bedrooms === 0 ? 'Studio' : p.bedrooms) : '—' },
          { label:'Bathrooms', value: p.bathrooms != null ? p.bathrooms + (p.half_bathrooms ? ' + ½' : '') : '—' },
          { label:'Sq. footage', value: p.square_footage ? Number(p.square_footage).toLocaleString() + ' sqft' : '—' },
          { label:'Type', value: p.property_type ? capitalize(p.property_type) : '—' },
          { label:'Available', value: p.available_date ? new Date(p.available_date).toLocaleDateString() : '—' },
          { label:'Pets allowed', value: p.pets_allowed ? 'Yes' : 'No' },
          { label:'Parking', value: p.parking || 'No' },
          { label:'Laundry', value: p.laundry_type ? capitalize(p.laundry_type.replace(/_/g, ' ')) : '—' },
          { label:'Heating', value: p.heating_type || '—' },
          { label:'Cooling', value: p.cooling_type || '—' }
        ];
        
        const gridHtml = `<div class="pd-grid">
          ${fields.map(f => `<div class="pd-field"><div class="pd-field-label">${f.label}</div><div class="pd-field-value">${esc(String(f.value))}</div></div>`).join('')}
        </div>`;
        
        // Amenities
        const amenities = Array.isArray(p.amenities) ? p.amenities : [];
        const amenHtml = amenities.length > 0 ? 
          `<div class="pd-section-title">Amenities</div>
           <div style="margin-bottom:24px">${amenities.map(a => `<div class="pd-amenity-item"><i class="fas fa-check" style="color:var(--brand)"></i> ${esc(a)}</div>`).join('')}</div>` : '';
           
        // Title update
        document.title = `${esc(p.address)} · Choice Properties`;
        
        // Final Assembly
        root.innerHTML = `
          ${galleryHtml}
          
          <div class="prop-layout">
            <div class="prop-main">
              <div class="pd-header">
                <div class="pd-header-price">${fmtMoney(p.monthly_rent)}<span>/mo</span></div>
                <h1 class="pd-header-title">${esc(p.title || p.address)}</h1>
                <div class="pd-header-address"><i class="fas fa-map-marker-alt"></i> ${esc([p.address, p.city, p.state, p.zip].filter(Boolean).join(', '))}</div>
              </div>
              
              <div class="pd-section-title">Property Details</div>
              ${gridHtml}
              
              <div class="pd-section-title">Description</div>
              <div class="pd-desc">${esc(p.description || 'No description provided.')}</div>
              
              ${amenHtml}
            </div>
            
            <div class="prop-sidebar">
              <div class="prop-sidebar-card">
                <div class="pd-header-price" style="font-size:1.5rem">${fmtMoney(p.monthly_rent)}<span>/mo</span></div>
                <div style="font-size:0.85rem;color:var(--muted);margin-bottom:16px;">
                  Security Deposit: ${fmtMoney(p.security_deposit)}<br>
                  Application Fee: ${fmtMoney(p.application_fee)}
                </div>
                <div class="prop-action-bar">
                  <a href="/apply/index.html?id=${esc(p.id)}" class="btn btn-primary btn-full">Apply Now</a>
                  <button class="btn btn-ghost btn-full" onclick="alert('Saving properties requires an account.')"><i class="far fa-heart"></i> Save</button>
                </div>
              </div>
            </div>
          </div>
        `;
        
      } catch (err) {
        root.innerHTML = `<div class="empty"><h3>Error</h3><p>${esc(err.message)}</p><a href="/listings.html" class="btn btn-primary">Browse Listings</a></div>`;
      }
    });
  </script>
</body>
</html>
